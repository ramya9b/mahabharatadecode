<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1C1206"/>
      <stop offset="55%" stop-color="#0E0900"/>
      <stop offset="100%" stop-color="#050300"/>
    </radialGradient>

    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FBBF24"/>
      <stop offset="20%"  stop-color="#A3E635"/>
      <stop offset="40%"  stop-color="#34D399"/>
      <stop offset="60%"  stop-color="#38BDF8"/>
      <stop offset="80%"  stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="50%"  stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>

    <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- Glowing rainbow ring with animated pulse (opacity + glow breathe) -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#rainbow)"
          stroke-width="4" filter="url(#ringGlow)">
    <animate attributeName="opacity"
             values="0.95;0.55;0.95" dur="3s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="stroke-width"
             values="4;4.8;4" dur="3s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </circle>

  <!-- Inner accent ring, gently counter-pulsing -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#rainbow)"
          stroke-width="0.8" opacity="0.35">
    <animate attributeName="opacity"
             values="0.35;0.6;0.35" dur="3s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </circle>

  <!-- Luminous gold M with a soft breathing glow -->
  <text x="50" y="68" font-family="Georgia, 'Times New Roman', serif"
        font-size="56" font-weight="700" fill="url(#gold)"
        text-anchor="middle" filter="url(#mGlow)">M
    <animate attributeName="opacity"
             values="1;0.82;1" dur="3s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </text>
</svg>
