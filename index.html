    <!-- Anti-FOUC: apply saved theme before React loads -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('mbd-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.background = '#080614';
          } else {
            document.documentElement.style.background = '#F5EDDA';
          }
        } catch(e) {}
      })();
    </script>
