    <!-- ══════════════════════════════════════════════════════
         FONTS — Cinzel + Cormorant Garamond + Noto language scripts
         Non-blocking load via rel=preload swap → does not block first paint.
         <noscript> fallback ensures fonts still load if JS is disabled.
         ══════════════════════════════════════════════════════ -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Noto+Serif+Devanagari:wght@400;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Telugu:wght@400;600;700&family=Noto+Serif+Kannada:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Noto+Serif+Devanagari:wght@400;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Telugu:wght@400;600;700&family=Noto+Serif+Kannada:wght@400;600;700&display=swap" /></noscript>

    <!-- Anti-FOUC: apply saved theme before React loads -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('mbd-theme');
          if (stored === 'light') {
            /* User explicitly chose light — pure white */
            document.documentElement.style.background = '#FEFBF6';
          } else {
            /* Default: dark Golden Rainbow for all new visitors */
            document.documentElement.classList.add('dark');
            document.documentElement.style.background = '#100713';
          }
        } catch(e) {}
      })();
    </script>

    <style>
      .skip-nav {
        position: absolute; top: -100px; left: 16px; z-index: 9999;
        padding: 12px 20px; background: #4A1D6A; color: #F5EDDA;
        font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
        border-radius: 0 0 8px 8px; text-decoration: none; transition: top 0.2s;
      }
      .skip-nav:focus { top: 0; outline: 3px solid #14532D; outline-offset: 2px; }
    </style>

    <!-- Google Analytics 4 — MahabharataDecoded -->
    <script>
      /* Defer GA4 until after page is interactive — keeps it off the critical path for LCP */
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-453G97F065';
          document.head.appendChild(s);
        }, 1200);
      });
    </script>
    <script>
      /* dataLayer/gtag are defined synchronously — they're just an array
         and a single function declaration (sub-ms cost). React calls
         window.gtag() inside route-change useEffects which run BEFORE
         DOMContentLoaded fires, so deferring init breaks the first page
         view. The expensive GTM script itself is already deferred above. */
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.GA4_ID = 'G-453G97F065';
      window.gtag('js', new Date());
      window.gtag('config', 'G-453G97F065', {
        send_page_view: false,   /* SPA: we fire manually on each route change */
        cookie_flags: 'SameSite=None;Secure',
      });
    </script>
    <!-- Preload critical Cinzel font for faster first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  </head>
  <body>
    <!-- Pre-hydration skip-link: deliberately English-only.
         The React app (Navbar.tsx) renders a second, translated skip-link
         once hydrated. Keeping this one ensures keyboard/screen-reader users
         can skip nav even before JS boots or if the bundle fails to load.
         If a non-English user reads two skip-links during the first paint,
         that is an acceptable trade for guaranteed pre-hydration a11y. -->
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
