name = "mahabharatadecoded"
compatibility_date = "2024-01-01"

[site]
bucket = "./dist"

# ── Build settings (used by Cloudflare dashboard auto-detection) ──
# Framework: Vite
# Build command: npm run build
# Output directory: dist
# Node version: 18

# ── Environment Variables ──
# Add VITE_GEMINI_API_KEY in Cloudflare Pages dashboard:
# Pages → mahabharatadecoded → Settings → Environment variables
# Variable name: VITE_GEMINI_API_KEY
# Value: your Gemini API key from ai.google.dev
